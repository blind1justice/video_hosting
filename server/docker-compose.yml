services:
  db:
    image: postgres:16-alpine
    container_name: video_hosting_db
    environment:
      POSTGRES_DB: video_hosting_db
      POSTGRES_USER: video_hosting_db
      POSTGRES_PASSWORD: video_hosting_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - video_hosting_network

  s3:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - video_hosting_network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - video_hosting_network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: video_hosting_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video_hosting_network

networks:
  video_hosting_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  mailpit_data:
  rabbitmq_data:
